name: Release

# Builds a static triage binary for each OS/arch below and attaches it to a
# GitHub Release whenever a version tag (v1.2.3) is pushed. The release
# (and its auto-generated notes) is created once by create-release; each
# matrix leg then only attaches its own archive to that existing release.
#
# generate_release_notes must run exactly once: softprops/action-gh-release
# prepends newly-generated notes to whatever body the release already has,
# so calling it with generate_release_notes: true from every matrix leg
# compounds the notes once per leg instead of writing them once.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/triage ./cmd/triage
          tar -C dist -czf "triage_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" triage

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: triage_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
